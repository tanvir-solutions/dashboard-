<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
        :root,
        body.colorful {
            --s1: #0a2f6b;
            --s2: #051c45;
            --sbt: #fff;
            --acc: #1565ff;
            --hd: #0a2a63;
            --bg: #eaf2fd;
            --pn: #fff;
            --tx: #0b2a5b;
            --tx2: #40608f;
            --bn: #cdeedb;
            --gr: #e3e9f3;
            --bd: #c5d4ea;
            --hdr: linear-gradient(120deg, #dbe9fb, #eef4fd 55%, #e0eefb);
            --sh: #0b2a5b22;
            --plate: transparent
        }

        body.dark {
            --s1: #0b0b0b;
            --s2: #000;
            --sbt: #fff;
            --acc: #3b82f6;
            --hd: #1a1a1a;
            --bg: #050505;
            --pn: #121212;
            --tx: #f2f2f2;
            --tx2: #a8a8a8;
            --bn: #10301f;
            --gr: #222;
            --bd: #2a2a2a;
            --hdr: linear-gradient(120deg, #0f0f0f, #1a1a1a);
            --sh: #000a;
            --plate: rgba(255, 255, 255, .93)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--tx)
        }

        .sb {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 170px;
            background: linear-gradient(var(--s1), var(--s2));
            color: var(--sbt);
            padding: 18px 10px;
            text-align: center;
            z-index: 3;
            border-right: 1px solid var(--bd)
        }

        body.colorful .sb,
        body.dark .sb {
            border-right: 0
        }

        .sb .lg {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: #8883;
            margin: 0 auto 8px
        }

        .sb h3 {
            font-size: 13px;
            margin: 0 0 28px
        }

        .sb a {
            display: block;
            text-align: left;
            padding: 11px 14px;
            margin: 4px 0;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer
        }

        .sb a.on {
            background: var(--acc);
            color: #fff
        }

        .mn {
            margin-left: 170px;
            padding: 12px 16px;
            height: 100vh;
            min-height: 900px;
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .hd {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 18px;
            padding: 14px 20px;
            border-radius: 14px;
            background: var(--hdr);
            border: 1px solid var(--bd);
            box-shadow: 0 2px 10px var(--sh)
        }

        .lgp {
            flex: 0 0 auto;
            width: 230px;
            height: 104px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            padding: 8px 12px
        }

        body.dark .lgp {
            background: var(--plate)
        }

        .lgp img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block
        }

        .bi {
            flex: 1 1 380px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 5px
        }

        .b0 {
            font-size: 11px;
            letter-spacing: 1.6px;
            font-weight: 700;
            color: var(--tx2);
            text-transform: uppercase
        }

        .b1 {
            font-size: 30px;
            font-weight: 800;
            line-height: 1.1;
            text-transform: uppercase;
            color: var(--tx)
        }

        .bl {
            display: flex;
            align-items: flex-start;
            gap: 7px;
            font-size: 13px;
            color: var(--tx2);
            line-height: 1.35
        }

        .bl svg {
            flex: none;
            width: 15px;
            height: 15px;
            margin-top: 1px;
            stroke: var(--acc);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .br {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 22px
        }

        .br span {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--tx2)
        }

        .br svg {
            width: 15px;
            height: 15px;
            stroke: var(--acc);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .rt {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 9px
        }

        .dt {
            font-size: 12px;
            font-weight: 600
        }

        .dt s {
            color: #16a34a;
            text-decoration: none
        }

        .ba {
            display: flex;
            gap: 10px;
            position: relative
        }

        .bt {
            background: var(--acc);
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 11px 17px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit
        }

        .bt2 {
            background: var(--pn);
            color: var(--tx);
            border: 1px solid var(--bd);
            display: flex;
            align-items: center;
            gap: 8px
        }

        .sw {
            display: flex
        }

        .sw u {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--pn);
            margin-left: -4px
        }

        .sw u:first-child {
            margin: 0
        }

        .tm {
            display: none;
            position: absolute;
            top: 46px;
            right: 0;
            background: var(--pn);
            border: 1px solid var(--bd);
            border-radius: 8px;
            padding: 6px;
            z-index: 5;
            min-width: 170px;
            box-shadow: 0 4px 14px #0004
        }

        .tm button {
            display: block;
            width: 100%;
            text-align: left;
            border: 0;
            background: none;
            color: var(--tx);
            padding: 9px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit
        }

        .tm button:hover,
        .tm button.on {
            background: var(--gr)
        }

        .sl {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 13px
        }

        .sl select {
            padding: 9px 14px;
            border: 1px solid var(--bd);
            border-radius: 8px;
            min-width: 260px;
            font-weight: 700;
            color: var(--tx);
            background: var(--pn);
            font-family: inherit
        }

        .g6 {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px
        }

        .c {
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 92px;
            color: #fff
        }

        .ic {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #fff3;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .ic svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .tx {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-width: 0
        }

        .tx small {
            font-size: 11.5px;
            font-weight: 800;
            line-height: 1.2;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .tx b {
            font-size: 30px;
            line-height: 1.1
        }

        .b11 {
            background: linear-gradient(135deg, #1565ff, #18a8f5)
        }

        .b12 {
            background: linear-gradient(135deg, #15a34a, #7ed321)
        }

        .b13 {
            background: linear-gradient(135deg, #6d28d9, #b06bff)
        }

        .b14 {
            background: linear-gradient(135deg, #0d9488, #34d8c0)
        }

        .b15 {
            background: linear-gradient(135deg, #ef4444, #fb923c)
        }

        .b16 {
            background: linear-gradient(135deg, #f59e0b, #fcd34d)
        }

        .td .c {
            color: #0b2a5b;
            min-height: 78px
        }

        .td .tx b {
            font-size: 26px
        }

        .td .ic {
            background: #fff9
        }

        .td .b11 {
            background: #cfe3ff
        }

        .td .b12 {
            background: #d4f3d8
        }

        .td .b13 {
            background: #e4d9fb
        }

        .td .b14 {
            background: #c9f1ea
        }

        .td .b15 {
            background: #fde0cc
        }

        .td .b16 {
            background: #fdf0c4
        }

        .bn {
            background: var(--bn);
            border-radius: 8px;
            text-align: center;
            padding: 9px;
            font-weight: 800;
            font-size: 17px
        }

        .rw {
            display: grid;
            gap: 10px;
            flex: 1;
            min-height: 420px;
            grid-template-columns: .85fr 1.1fr 1.1fr;
            grid-template-rows: minmax(0, 1fr) minmax(0, 1fr)
        }

        .sp2 {
            grid-column: span 2
        }

        .p {
            background: var(--pn);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 1px 5px var(--sh);
            display: flex;
            flex-direction: column;
            min-width: 0
        }

        .p h4 {
            margin: 0;
            background: var(--hd);
            color: #fff;
            padding: 9px 14px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .p h4 span {
            background: var(--acc);
            border-radius: 5px;
            padding: 3px 11px;
            font-size: 12px;
            cursor: pointer
        }

        .pb {
            flex: 1;
            min-height: 0;
            position: relative;
            padding: 8px
        }

        @media(max-width:1100px) {
            .mn {
                height: auto;
                min-height: 0
            }

            .g6 {
                grid-template-columns: repeat(3, 1fr)
            }

            .rw {
                grid-template-columns: 1fr;
                grid-template-rows: none
            }

            .sp2 {
                grid-column: auto
            }

            .p {
                min-height: 280px
            }
        }

        .m {
            position: fixed;
            inset: 0;
            background: #0009;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9
        }

        .m>div {
            background: var(--pn);
            color: var(--tx);
            padding: 20px;
            border-radius: 12px;
            width: 380px;
            max-width: 96vw;
            max-height: 92vh;
            overflow: auto
        }

        .m h3 {
            margin: 0 0 12px
        }

        .m input[type=text],
        .m input[type=password],
        .m input[type=number] {
            width: 100%;
            padding: 8px;
            margin: 3px 0 8px;
            border: 1px solid var(--bd);
            border-radius: 6px;
            background: var(--pn);
            color: var(--tx);
            font-family: inherit
        }

        .m input[type=color] {
            width: 46px;
            height: 30px;
            padding: 0;
            border: 1px solid var(--bd);
            border-radius: 6px;
            background: none;
            vertical-align: middle
        }

        .fl {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--tx2)
        }

        .gr2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 12px
        }

        .gr3 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0 10px
        }

        .stb {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--bd);
            padding-bottom: 10px
        }

        .stb button {
            border: 1px solid var(--bd);
            background: var(--pn);
            color: var(--tx);
            border-radius: 8px;
            padding: 8px 13px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit
        }

        .stb button.on {
            background: var(--acc);
            color: #fff;
            border-color: var(--acc)
        }

        .sec {
            display: none
        }

        .sec.on {
            display: block
        }

        .m details {
            border: 1px solid var(--bd);
            border-radius: 8px;
            padding: 8px 10px;
            margin: 6px 0
        }

        .m summary {
            cursor: pointer;
            font-weight: 700
        }

        .note {
            font-size: 12px;
            color: var(--tx2);
            margin: 2px 0 8px
        }

        .warn {
            color: #dc2626;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px
        }

        .sbar {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 34px;
            border-top: 1px solid var(--bd);
            padding: 16px 0 6px
        }

        .tb2 {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px
        }

        .tb2 th {
            text-align: right;
            padding: 8px;
            font-weight: 800
        }

        .tb2 td {
            padding: 9px 8px;
            text-align: right;
            border-bottom: 1px solid var(--bd)
        }

        .tb2 th:first-child,
        .tb2 td:first-child {
            text-align: left
        }

        .tb2 tr.tt td {
            font-weight: 800;
            border-top: 2px solid var(--hd)
        }

        .dtl {
            max-height: 60vh;
            overflow: auto
        }

        .er {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 700
        }

        .ld {
            grid-column: 1/-1;
            text-align: center;
            padding: 26px;
            color: var(--tx2);
            font-weight: 700
        }

        .sb {
            box-shadow: 2px 0 14px #0003
        }

        .sb .lg {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            margin: 2px auto 10px;
            background: #ffffff1f;
            border: 2px solid #ffffff66;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px #0004
        }

        .sb .lg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }

        .sb .lg svg {
            width: 36px;
            height: 36px;
            stroke: #ffffffaa;
            fill: none;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .sb h3 {
            font-size: 14.5px;
            font-weight: 700;
            line-height: 1.25;
            margin: 0 0 3px;
            word-break: break-word
        }

        .sb .ds {
            font-size: 12px;
            opacity: .82;
            line-height: 1.3;
            margin: 0 0 95px;
            word-break: break-word
        }

        .sb .nv {
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left
        }

        .sb a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            margin: 0;
            border-radius: 10px;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s
        }

        .sb a svg {
            width: 18px;
            height: 18px;
            flex: none;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .sb a:hover {
            background: #ffffff1a
        }

        .sb a.on {
            background: var(--acc);
            color: #fff;
            box-shadow: 0 4px 12px #0003
        }

        .c {
            border-radius: 14px;
            box-shadow: 0 4px 12px #0b2a5b26;
            transition: transform .15s, box-shadow .15s
        }

        .c:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px #0b2a5b33
        }

        .p {
            border-radius: 14px
        }

        .p h4 {
            padding: 11px 16px;
            letter-spacing: .2px
        }

        .hd {
            border-radius: 16px
        }

        .bn {
            border-radius: 10px
        }

        .bt {
            border-radius: 9px;
            transition: filter .15s
        }

        .bt:hover {
            filter: brightness(1.08)
        }

        .sl select {
            border-radius: 9px
        }

        .m {
            background: rgba(8, 20, 48, .28)
        }

        .m>div {
            border-radius: 16px;
            box-shadow: 0 18px 50px #0006
        }

        .pwr {
            position: relative
        }

        .pwr input {
            margin: 0 !important;
            padding-right: 42px !important
        }

        .eye {
            position: absolute;
            right: 11px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--tx2);
            display: flex
        }

        .eye svg {
            width: 19px;
            height: 19px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .brow {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 12px
        }

        .pmsg {
            font-size: 12.5px;
            margin-top: 10px;
            color: var(--tx2);
            min-height: 16px
        }

        .pmsg.er2 {
            color: #dc2626;
            font-weight: 700
        }

        .pfr {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            align-items: flex-start
        }

        .pfph {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: var(--gr);
            border: 2px solid var(--bd);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none
        }

        .pfph img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }

        .pfph svg {
            width: 44px;
            height: 44px;
            stroke: var(--tx2);
            fill: none;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .pfpv {
            width: 176px;
            border-radius: 12px;
            background: #0a2f6b;
            color: #fff;
            padding: 14px 10px;
            text-align: center;
            flex: none
        }

        .sb .pi {
            display: block
        }

        .cr {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 6px 0
        }

        .cr input {
            margin: 0 !important;
            flex: 1
        }

        .xb {
            padding: 8px 12px;
            flex: none
        }

        .bt2.dg {
            color: #dc2626;
            border-color: #dc262655
        }

        @media(max-width:760px) {
            .sb {
                position: static;
                width: auto;
                padding: 10px 12px;
                display: flex;
                align-items: center;
                gap: 12px;
                text-align: left
            }

            .sb .pi {
                display: flex;
                align-items: center;
                gap: 10px
            }

            .sb .lg {
                width: 46px;
                height: 46px;
                margin: 0
            }

            .sb h3 {
                font-size: 13px;
                margin: 0
            }

            .sb .ds {
                margin: 0
            }

            .sb .nv {
                flex-direction: row;
                margin: 0 0 0 auto
            }

            .sb a {
                padding: 8px 10px;
                font-size: 13px
            }

            .sb a svg {
                display: none
            }

            .mn {
                margin-left: 0
            }

            .g6 {
                grid-template-columns: repeat(2, 1fr)
            }

            .gr2,
            .gr3 {
                grid-template-columns: 1fr 1fr
            }
        }

        .bt.dm {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .dm .sw u {
            background: #fff;
            border-color: var(--acc)
        }

        .dm .sw u:nth-child(2) {
            background: #ffffffcc
        }

        .dm .sw u:nth-child(3) {
            background: #ffffff88
        }

        /* ===== Reports page (merged from Reports.html; container id is #rpt) ===== */
        #rpt {
            display: none;
            margin-left: 170px;
            padding: 14px 18px
        }

        body.rp-on .mn {
            display: none
        }

        body.rp-on #rpt {
            display: block
        }

        .rp-c {
            background: var(--pn);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 10px var(--sh)
        }

        .rp-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px
        }

        .rp-tabs button {
            border: 1px solid var(--bd);
            background: var(--pn);
            color: var(--tx);
            border-radius: 20px;
            padding: 9px 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit
        }

        .rp-tabs button.on {
            background: var(--acc);
            color: #fff;
            border-color: var(--acc)
        }

        .rp-f {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: flex-end
        }

        .rp-f label {
            font-size: 12px;
            font-weight: 700;
            color: var(--tx2);
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .rp-f select,
        .rp-f input {
            padding: 9px 10px;
            border: 1px solid var(--bd);
            border-radius: 8px;
            background: var(--pn);
            color: var(--tx);
            font-family: inherit;
            min-width: 130px
        }

        .rp-f .sp {
            flex: 1
        }

        .rp-h {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            margin: 2px 0
        }

        .rp-sub {
            text-align: center;
            font-size: 12px;
            color: var(--tx2);
            margin-bottom: 10px
        }

        #rpt .ov {
            overflow-x: auto

        #rpt table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px

        #rpt th {

            color: #fff;
            padding: 10px;
            text-align: right
        }

        #rpt td {
            padding: 9px 10px;
            text-align: right;
            border-bottom: 1px solid var(--bd)
        }

        #rpt th:first-child,
        #rpt td:first-child {
            text-align: left
        }

        #rpt td.t {
            font-weight: 800
        }

        #rpt tr.gt td {
            font-weight: 800;
            background: var(--gr)
        }

        .sb .ds {
            margin: 0 0 2px

        .sb .ds.co {
            margin: 0 0 95px

                margin-left: 0
            }

            .sb .ds.co {
                margin: 0
            }
        }

                margin: 10mm
            }

            body.rp-on .sb,
            .rp-no {
                display: none !important
            }

            body.rp-on #rpt {
                margin: 0;
                padding: 0
            }

            #rpt .rp-c {
                border: 0;
                box-shadow: none
            }

            #rpt th {
                background: #0a2f6b !important;
                color: #fff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact
            }
        }

        /* ===== Reports page: dark navy design (all colors editable in Settings > Theme & colors > Step 5) ===== */
        :root {
            --rp-bg: #070d24;
            --rp-side: #0f3fb8;
            --rp-menu: #2f6bff;
            --rp-fcard: #0d1b4c;
            --rp-rcard: #0d1b4c;
            --rp-tab: #142a66;
            --rp-tabon: #2f6bff;
            --rp-field: #091338;
            --rp-head: #14306e;
            --rp-grand: #14306e;
            --rp-text: #ffffff
        }

        body {
            --rp-sub: color-mix(in srgb, var(--rp-text) 62%, transparent);
            --rp-line: color-mix(in srgb, var(--rp-text) 16%, transparent)
        }

        body.rp-on {
            background: var(--rp-bg);
            color: var(--rp-text)
        }

        body.rp-on .sb {
            background: var(--rp-side);
            border-right: 0
        }

        body.rp-on .sb a.on {
            background: var(--rp-menu)
        }

        #rpt {
            color: var(--rp-text)
        }

        #rpt .rp-c {
            background: var(--rp-fcard);
            border: 0;
            border-radius: 16px;
            box-shadow: none;
            padding: 16px
        }

        #rpt .rp-c.rp-res {
            background: var(--rp-rcard)
        }

        #rpt .rp-tabs button {
            background: var(--rp-tab);
            color: var(--rp-text);
            border: 0
        }

        #rpt .rp-tabs button.on {
            background: var(--rp-tabon);
            color: #fff
        }

        #rpt .rp-f label {
            color: var(--rp-sub)
        }

        #rpt .rp-f select,
        #rpt .rp-f input {
            background: var(--rp-field);
            color: var(--rp-text);
            border: 1px solid var(--rp-line);
            color-scheme: dark
        }

        #rpt .bt {
            background: var(--rp-tabon);
            color: #fff
        }

        #rpt .bt2 {
            background: var(--rp-tab);
            color: var(--rp-text);
            border: 1px solid var(--rp-line)
        }

        #rpt th {
            background: var(--rp-head);
            color: var(--rp-text)
        }

        #rpt td {
            border-bottom: 1px solid var(--rp-line)
        }

        #rpt tr.gt td {
            background: var(--rp-grand)
        }

        #rpt .rp-sub {
            color: var(--rp-sub)
        }

        #rpt .rp-empty {
            text-align: center;
            padding: 56px 10px;
            color: var(--rp-sub);
            font-weight: 600
        }

        @media print {
            body.rp-on {
                background: #fff !important
            }

            body.rp-on #rpt .rp-c {
                background: #fff !important;
                padding: 0
            }

            body.rp-on #rpt td,
            body.rp-on #rpt .rp-h,
            body.rp-on #rpt .rp-sub {
                color: #000 !important
            }

            body.rp-on #rpt th {
                background: var(--rp-head) !important;
                color: var(--rp-text) !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact
            }

            body.rp-on #rpt tr.gt td {
                background: #e3e9f3 !important;
                color: #000 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact
            }
        }

        /* ===== Settings > Theme & colors ===== */
        .tcs {
            font-weight: 800;
            font-size: 13px;
            margin: 14px 0 6px;
            padding-top: 10px;
            border-top: 1px solid var(--bd)
        }

        .tcg {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px
        }

        .tci {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 7px 9px;
            min-width: 0
        }

        .tci b {
            display: block;
            font-size: 12px
        }

        .tci small {
            font-size: 11px;
            color: var(--tx2)
        }

        .tci input[type=color] {
            flex: none
        }

        @media(max-width:760px) {
            .tcg {
                grid-template-columns: 1fr 1fr
            }
        }

        .tdx {
            margin-top: 16px;
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 12px 14px;
            background: var(--gr)
        }

        .tdx-h {
            font-weight: 800;
            font-size: 14px;
            margin-bottom: 4px
        }

        .tdx-t {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 6px;
            background: var(--pn);
            border-radius: 8px;
            overflow: hidden
        }

        .tdx-t th {
            text-align: left;
            padding: 7px 10px;
            background: var(--hd);
            color: #fff;
            font-size: 12px
        }

        .tdx-t td {
            padding: 7px 10px;
            border-bottom: 1px solid var(--bd);
            vertical-align: top
        }

        .tdx-t td:first-child {
            font-weight: 800;
            width: 42%
        }

        .tdx-t code {
            background: var(--gr);
            padding: 1px 6px;
            border-radius: 5px;
            font-weight: 800;
            color: var(--acc)
        }

        /* ===== Settings > Reports > 3. Reports access ===== */
        .rpa {
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 14px;
            margin-top: 18px;
            background: var(--pn)
        }

        .rpa-h {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 800;
            margin: 0 0 12px
        }

        .rpa-h i {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: var(--acc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: normal;
            font-size: 14px;
            flex: none
        }

        .rpa-st {
            margin-left: auto;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 11px;
            border-radius: 20px;
            letter-spacing: .5px
        }

        .rpa-st.on {
            background: #fee2e2;
            color: #b91c1c
        }

        .rpa-st.off {
            background: #dcfce7;
            color: #15803d
        }

        .rpa-b {
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 12px;
            background: var(--gr)
        }

        .rpa-t {
            font-weight: 800;
            font-size: 13.5px;
            margin-bottom: 3px
        }

        .rpa-d {
            font-size: 12px;
            color: var(--tx2);
            font-weight: 400;
            line-height: 1.4
        }

        .rpa-sw {
            display: flex;
            gap: 12px;
            align-items: center;
            cursor: pointer;
            margin: 0
        }

        .rpa-sw input {
            width: 20px;
            height: 20px;
            flex: none;
            margin: 0
        }

        .rpa-em {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border: 1px solid var(--bd);
            border-radius: 10px;
            background: var(--pn);
            margin: 6px 0
        }

        .rpa-em span {
            flex: 1;
            font-weight: 700;
            word-break: break-all;
            font-size: 13px
        }

        .rpa .brow {
            margin-top: 10px
        }

        /* ===== Sync Now button ===== */
        .bt.sy {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 128px;
            justify-content: center
        }

        .sy svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex: none
        }

        .sy.go svg {
            animation: spn .9s linear infinite
        }

        .sy.ok {
            background: #16a34a
        }

        .sy:disabled {
            opacity: .9;
            cursor: wait
        }

        @keyframes spn {
            to {
                transform: rotate(360deg)
            }
        }

        /* ===== Settings > General > TODAY table ===== */
        .tdx-t input {
            margin: 0 !important;
            padding: 6px 8px !important;
            text-transform: uppercase
        }

        .tdx-t td.tdn {
            color: var(--tx2);
            font-size: 12px
        }

        .tdx-t td:first-child {
            width: 38%
        }

        .tdx-t .tdnote {
            font-size: 12px;
            color: var(--tx2);
            font-weight: 600
        }

        .m details>.gr2 {
            margin-top: 8px
        }

        .m summary small {
            font-weight: 400;
            color: var(--tx2);
            margin-left: 6px
        }
    </style>
</head>
